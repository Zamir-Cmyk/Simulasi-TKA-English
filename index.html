<style>

*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font:700 1.7rem/1.2 Georgia,serif;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:12px 0}
.pass{font-family:Georgia,serif;line-height:1.7;max-width:70ch}.pass h3{margin:.1em 0 .4em}.pass p{margin:.5em 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
.grid .cur{outline:2px solid var(--acc)}.grid .done{background:var(--accbg)}.grid .g-ok{background:var(--okbg);border-color:var(--ok)}.grid .g-bad{background:var(--badbg);border-color:var(--bad)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:11px 13px;margin:8px 0;font:inherit;cursor:pointer}

.note{font-size:.92rem;margin-top:6px;color:var(--mute)}
.btn{background:var(--acc);color:var(--card);border:0;border-radius:8px;padding:10px 18px;font:600 1rem inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.score{font:700 3rem Georgia,serif}

<script>
const P={
s:["The Mechanic’s Promise","Rafi was a vocational high school student who enjoyed learning about motorcycles. Every afternoon, after finishing his classes, he helped his uncle at a small motorcycle repair shop near his house.|One day, an elderly woman came to the shop with her motorcycle. She looked worried because the motorcycle suddenly stopped while she was on her way home. Rafi’s uncle was busy repairing another customer’s vehicle, so Rafi asked if he could check the motorcycle.|At first, Rafi could not find the problem. He checked the fuel, the battery, and several cables. After carefully examining the engine, he discovered that one small connection was loose. He repaired it and started the motorcycle again. The engine worked perfectly.|The woman was very grateful. She offered Rafi some money, but he politely refused because the repair had been simple. Instead, he asked her to drive carefully and return to the shop if she had another problem.|A few weeks later, Rafi needed information about a training program at a local automotive company. To his surprise, the elderly woman’s son worked there. After hearing about Rafi’s kindness and skills, he helped Rafi learn about the program and encouraged him to apply.|Rafi was accepted into the training program. He realized that good skills were important, but honesty, patience, and kindness could also create valuable opportunities."],
h:["Smart Workplace Habits","1. Arrive on Time — Plan your journey and arrive before work begins.|2. Follow Safety Rules — Wear appropriate protective equipment and follow instructions.|3. Communicate Clearly — Ask questions when instructions are unclear and share important information.|4. Keep Your Workspace Organized — Return tools and materials to their proper places.|5. Check Your Work — Review your work before finishing a task.|6. Manage Your Time — Prioritize important tasks and avoid unnecessary delays.|7. Work Well with Others — Respect different opinions and cooperate with team members.|8. Keep Learning — Learn from feedback and improve your professional skills.|9. Solve Problems Calmly — Identify the cause of a problem before making a decision.|10. Act Professionally — Be responsible, respectful, and honest at work."],
o:["Solar-Powered Street Lights","Many cities and villages are looking for ways to save energy and reduce pollution. Solar-powered street lights use energy from the sun instead of depending completely on electricity from the power grid.|During the day, solar panels collect sunlight and convert it into electrical energy. This energy is stored in a battery. At night, the stored energy powers the lamp and provides light for roads, parks, and public areas.|Solar-powered street lights can reduce electricity costs and operate in places where access to the main power grid is limited. They also use renewable energy. However, long periods of cloudy weather can affect performance, and batteries and panels require regular maintenance.|Despite these challenges, solar-powered lighting is becoming an important option for communities that want cleaner and more efficient sources of energy."],
d:["Digital Skills for Vocational Students","Digital technology has changed many workplaces. Employees in automotive workshops, hotels, offices, factories, and other industries often use digital tools to complete their tasks. Vocational students therefore need technical knowledge as well as useful digital skills.|Important skills include using software and applications, communicating professionally online, and protecting information. Workers may exchange messages, send emails, attend virtual meetings, and share documents through digital platforms. Students also need to create strong passwords and recognize suspicious messages.|A survey of 200 vocational students found that 78% regularly use digital tools for school tasks, 70% have attended an online meeting, 62% can create strong passwords, 41% regularly back up important files, 36% use spreadsheets confidently, and 84% want more digital skills training.|The results show that many students already use technology, but some important workplace skills still need improvement."],
a:["The Two Apprentices","Dimas and Arman were apprentices at the same furniture workshop. Dimas was confident and worked very quickly. Arman worked more slowly. He carefully measured the wood, checked the design, and asked questions whenever he was unsure.|One day, they received an important order for a large wooden cabinet. Dimas immediately started cutting the wood, while Arman studied the measurements once more.|Dimas ignored one important measurement. Later, he discovered that two pieces of wood did not fit together. He became frustrated because he had to repeat part of his work.|Arman helped him correct the mistake. Together, they completed the cabinet before the deadline. Dimas began checking his measurements before cutting, while Arman learned that careful work could still be completed efficiently. They both became better workers by learning from each other."],
bc:["The Young Chef","Nadia was a culinary student at a vocational high school. She dreamed of becoming a professional chef. One afternoon, her teacher announced that several students would prepare lunch for visitors from a local hotel. Nadia was excited but nervous because she had never cooked for such an important group.|Nadia and her team planned the menu carefully and divided their responsibilities. While preparing the main dish, Nadia accidentally added too much salt to one sauce. Instead of panicking, she told her teacher about the problem. Her teacher showed her how to balance the flavor by adding other ingredients.|The visitors enjoyed the meal and praised the students for their teamwork. Nadia learned that mistakes can happen in professional work, but staying calm, communicating honestly, and finding solutions are important skills."],
bi:["Preparing for a Job Interview","1. Research the Company.|2. Review the Job Requirements.|3. Prepare Your Documents: CV, portfolio, certificates.|4. Practice Common Questions.|5. Dress Appropriately.|6. Arrive Early.|7. Communicate Clearly.|8. Show Confidence.|9. Ask Relevant Questions.|10. Follow Up Professionally."],
be:["Electric Vehicles and the Future of Transportation","Electric vehicles, commonly called EVs, are becoming increasingly popular. Unlike conventional vehicles that use gasoline or diesel, EVs use electric motors powered by rechargeable batteries.|EVs can produce fewer direct emissions while being driven and can be quieter than conventional vehicles. However, drivers need access to charging stations, charging can take time, and battery production and disposal require careful management.|For vocational students in automotive programs, the growth of EVs creates new learning opportunities. Future technicians may need to understand batteries, electrical systems, software, and safety procedures related to high-voltage equipment."],
bs:["Why Workplace Safety Training Matters","Workplace safety is important in vocational fields such as construction, automotive technology, hospitality, and manufacturing. Safety training helps students and employees identify risks, use protective equipment, follow procedures, and report unsafe conditions.|A survey of 150 vocational students found that 88% know basic safety rules, 73% regularly use protective equipment, 81% know emergency exit locations, 69% have attended safety training, 57% can identify electrical hazards, and 76% want additional safety training.|The results suggest that many students understand basic safety, but technical hazard identification still requires further practice."],
bp:["The Printer Problem","Sinta and Budi were preparing documents for a school event. Budi operated the printer, while Sinta checked the documents for errors. Then the printer suddenly stopped working.|Budi wanted to give up, but Sinta checked possible causes. She fixed the paper tray, but the printer still showed an error. Sinta searched the error code in the printer manual while Budi checked the computer connection. They eventually discovered that the printer cable was loose.|After connecting the cable properly and restarting the printer, they completed the task before the deadline. Budi realized that he had wanted to give up too quickly, and both students agreed to check possible causes systematically in future problems."],
th:["Smart Workplace Habits for Vocational Students","1. Arrive on Time — Plan your journey and arrive before work begins.|2. Follow Safety Rules — Wear appropriate protective equipment and follow instructions.|3. Communicate Clearly — Ask questions when instructions are unclear and share important information.|4. Keep Your Workspace Organized — Return tools and materials to their proper places.|5. Check Your Work — Review your work before submitting or finishing a task.|6. Manage Your Time — Prioritize important tasks and avoid unnecessary delays.|7. Work Well with Others — Respect different opinions and cooperate with team members.|8. Keep Learning — Learn from feedback and improve your professional skills.|9. Solve Problems Calmly — Identify the cause of a problem before making a decision.|10. Act Professionally — Be responsible, respectful, and honest at work."],
to:["Solar-Powered Street Lights","Many cities and villages are now looking for ways to save energy and reduce pollution. One technology that can help is the solar-powered street light. Unlike traditional street lights, which depend completely on electricity from the power grid, solar-powered lights use energy from the sun.|During the day, solar panels collect sunlight and convert it into electrical energy. This energy is stored in a battery. At night, the stored energy powers the lamp and provides light for roads, parks, and public areas.|Solar-powered street lights have several advantages. They can reduce electricity costs and continue to operate in places where access to the main power grid is limited. They also use renewable energy, which produces less environmental pollution than energy sources based on fossil fuels.|However, these systems also have some challenges. Their performance can be affected by long periods of cloudy weather. In addition, the batteries and solar panels require regular maintenance to ensure that the system continues to work properly.|Despite these challenges, solar-powered lighting is becoming an important option for communities that want cleaner and more efficient sources of energy."],
td:["Why Digital Skills Matter for Vocational Students","Digital technology has changed many workplaces. Today, employees in automotive workshops, hotels, offices, factories, and other industries often use digital tools to complete their tasks. For this reason, vocational students need to develop not only technical knowledge but also useful digital skills.|One important skill is the ability to use software and digital applications. For example, office workers may use spreadsheets to organize information, while graphic design students may use design software to create visual products. In other fields, employees may use digital systems to record customer information or monitor equipment.|Another important skill is online communication. Workers often exchange messages, send emails, attend virtual meetings, and share documents through digital platforms. Knowing how to communicate clearly and professionally can help employees avoid misunderstandings.|Digital security is also important. Students need to understand how to create strong passwords, recognize suspicious messages, and protect personal or company information. Careless use of digital technology can create serious problems for individuals and organizations.|A survey of 200 vocational students produced the following results (Table 1. Digital Skills Among Vocational Students):|Use digital tools for school tasks — 78% (use apps or software regularly)|Can create strong passwords — 62% (understand basic digital security)|Have attended an online meeting — 70% (use video-conferencing platforms)|Regularly back up important files — 41% (save copies of important documents)|Want more digital skills training — 84% (interested in workplace technology)|Use spreadsheets confidently — 36% (need more practice)|The information shows that many students already use technology, but some important skills still need improvement. Schools can help students prepare for future employment by providing practical training in digital tools, communication, and security."],
ta:["The Two Apprentices","Dimas and Arman were apprentices at the same furniture workshop. Both of them wanted to become skilled furniture makers, but they had different working habits.|Dimas was confident and worked very quickly. He believed that finishing a task first was the best way to impress the workshop owner. Arman worked more slowly. He carefully measured the wood, checked the design, and asked questions whenever he was unsure.|One day, the workshop received an important order for a large wooden cabinet. The owner asked Dimas and Arman to work together. Dimas immediately started cutting the wood, while Arman studied the measurements once more.|“Why are you taking so long?” Dimas asked. “We need to finish quickly.”|Arman replied, “It is better to spend a few minutes checking than several hours repairing a mistake.”|Dimas continued working without checking one of the measurements. Later, he discovered that two pieces of wood did not fit together. He became frustrated because he had to start that part again.|Arman helped him correct the mistake. Together, they completed the cabinet before the deadline. The owner was pleased not only because the cabinet was finished on time but also because the two apprentices had learned to combine speed with careful planning.|From that day on, Dimas began checking his measurements before cutting, while Arman learned that careful work could still be completed efficiently. They both became better workers by learning from each other."],
pc:["The Young Chef","Nadia was a culinary student at a vocational high school. She dreamed of becoming a professional chef and opening her own small restaurant someday. Although she enjoyed cooking, she was sometimes nervous when preparing food for other people.|One afternoon, Nadia’s teacher announced that several students would prepare lunch for visitors from a local hotel. Nadia was excited but also worried. She had never cooked for such an important group before.|Nadia and her team planned the menu carefully. They selected ingredients, calculated the amount of food needed, and divided their responsibilities. Nadia was responsible for preparing the main dish.|While cooking, Nadia accidentally added too much salt to one of the sauces. Instead of panicking, she told her teacher about the problem. Her teacher showed her how to balance the flavor by adding other ingredients.|The visitors enjoyed the meal and praised the students for their teamwork. Nadia learned that mistakes can happen in professional work, but staying calm, communicating honestly, and finding solutions are important skills.|After the event, Nadia felt more confident. She realized that becoming a good chef was not only about cooking delicious food but also about learning from experience and working well with others."],
pi:["Preparing for a Job Interview","1. Research the Company — Learn about the company’s products, services, and values.|2. Review the Job Requirements — Understand the skills and responsibilities required for the position.|3. Prepare Your Documents — Bring your CV, portfolio, certificates, and other required documents.|4. Practice Common Questions — Prepare answers about your experience, skills, and career goals.|5. Dress Appropriately — Choose clean and professional clothing suitable for the workplace.|6. Arrive Early — Plan your journey and arrive before the interview begins.|7. Communicate Clearly — Speak politely, listen carefully, and answer questions directly.|8. Show Confidence — Maintain good posture and present your abilities positively.|9. Ask Relevant Questions — Show interest by asking appropriate questions about the job.|10. Follow Up Professionally — Send a polite message after the interview if appropriate."],
pe:["Electric Vehicles and the Future of Transportation","Electric vehicles, commonly called EVs, are becoming increasingly popular in many countries. Unlike conventional vehicles that use gasoline or diesel, electric vehicles use electric motors powered by rechargeable batteries.|One advantage of electric vehicles is that they can produce fewer direct emissions while being driven. This may help reduce air pollution, especially in crowded cities. Electric vehicles can also be quieter than conventional vehicles because electric motors produce less engine noise.|However, electric vehicles also face several challenges. Drivers need access to charging stations, and charging a battery can take longer than filling a conventional vehicle with fuel. In addition, the production and disposal of batteries require careful management.|For vocational students in automotive programs, the growth of electric vehicles creates new learning opportunities. Future automotive technicians may need to understand batteries, electrical systems, software, and safety procedures related to high-voltage equipment.|As transportation technology continues to develop, workers will need to update their skills and adapt to changes in the automotive industry."],
ps:["Why Workplace Safety Training Matters","Workplace safety is important in every industry. In vocational fields such as construction, automotive technology, hospitality, and manufacturing, workers may use equipment, chemicals, electricity, or other materials that require careful handling.|Safety training helps students and employees understand how to identify risks and prevent accidents. For example, workers may need to wear personal protective equipment, follow operating procedures, and report unsafe conditions.|Regular safety training can also help workers respond appropriately during emergencies. Knowing where emergency exits are located and understanding how to use safety equipment can reduce confusion when an unexpected situation occurs.|A survey involving 150 vocational students produced the following results (Table 1. Workplace Safety Awareness Among Vocational Students):|Know basic safety rules — 88% (learned safety procedures at school)|Regularly use protective equipment — 73% (use equipment during practical activities)|Know emergency exit locations — 81% (familiar with school workshops)|Have attended safety training — 69% (participated in safety instruction)|Can identify electrical hazards — 57% (need more technical practice)|Want additional safety training — 76% (interested in practical safety skills)|The results suggest that many students have a basic understanding of safety. However, some areas, particularly technical hazard identification, still require further training and practice."],
pp:["The Printer Problem","Sinta and Budi were students in a vocational school specializing in office management. Their class was preparing documents for a school event. The documents needed to be printed, organized, and delivered to the event committee before noon.|Budi was responsible for operating the printer, while Sinta checked the documents for errors. At first, everything went smoothly. Then, the printer suddenly stopped working.|Budi immediately became frustrated. “We don’t have time for this,” he said. “Maybe we should tell the teacher that we cannot finish.”|Sinta looked at the printer carefully. She checked the paper tray and found that the paper was not loaded correctly. However, after fixing it, the printer still showed an error message.|Instead of giving up, Sinta searched the error code in the printer manual. Budi checked the computer connection. After several minutes, they discovered that the printer cable was loose.|They connected the cable properly, restarted the printer, and continued printing the documents. They completed the task just before the deadline.|Afterward, Budi admitted that he had wanted to give up too quickly. Sinta said that technical problems often require patience and systematic thinking. From then on, they agreed to check possible causes one by one before making decisions."],
ct:["The Tourism Guide Project","Mira was a student in a tourism program. Her class was asked to create a one-day travel guide for visitors to their city. Mira wanted the guide to be attractive, but her teacher reminded the class that useful information was more important than decoration.|Mira’s group interviewed local visitors, checked transportation schedules, and compared several tourist attractions. They discovered that some places were popular but difficult to reach using public transportation. Instead of simply listing famous locations, the group organized the guide according to distance, travel time, cost, and visitor interests.|During the presentation, a local tourism officer praised the group’s practical approach. Mira learned that successful tourism services require creativity, accurate information, and an understanding of customers’ needs."],
cc:["Customer Service Basics","1. Greet customers politely.|2. Listen without interrupting.|3. Confirm the customer’s needs.|4. Explain options clearly.|5. Offer realistic solutions.|6. Stay calm when customers complain.|7. Protect customer information.|8. Record important details accurately.|9. Thank the customer.|10. Follow up when necessary."],
cw:["Waste Management in School Workshops","Practical learning can produce different kinds of waste, including paper, plastic, metal, food waste, and used materials. Schools can reduce environmental problems by separating waste according to its type.|Reusable materials should be used again when possible. Recyclable materials should be placed in appropriate containers. Hazardous waste requires special handling and should not be mixed with ordinary rubbish.|A good waste-management system also depends on student participation. Clear labels, regular training, and easy access to collection points can make environmentally responsible behavior easier to practice."],
ce:["Entrepreneurship and Small Business Planning","Many vocational students hope to start small businesses after graduation. A good business idea, however, is not enough. Entrepreneurs need to understand customers, calculate costs, plan prices, and manage income carefully.|A survey of 180 vocational students found that 72% were interested in starting a business, 54% had created a simple business idea, 38% had calculated estimated costs, 31% had conducted a basic customer survey, and 68% wanted more entrepreneurship training.|These figures suggest strong interest but also show that many students need more practice in turning ideas into realistic business plans."],
cb:["The Broken Website","Kevin and Laila were assigned to update their school’s event website. Kevin focused on adding attractive images, while Laila checked the links and information.|Before the website was published, Laila tested it on several devices. She found that one important registration button did not work on mobile phones. Kevin thought the problem was minor because the button worked on his laptop.|Laila explained that many students would use their phones to register. The two students tested the website again, corrected the problem, and checked all important links before publication.|Kevin learned that a digital product should be tested from the user’s perspective rather than only from the creator’s perspective."],
d1:["The School Library","The school library is located beside the science laboratory. It is not very large, but it is bright, quiet, and well organized. Tall wooden shelves stand along three walls, while the fourth wall has wide windows overlooking the school garden. The reading area contains twelve round tables and comfortable chairs. A small digital corner provides four computers for searching the catalogue and reading electronic books. Near the entrance, a notice board displays new-book announcements and student recommendations. The librarian, Mrs. Hana, keeps the room tidy and welcomes students with a warm smile. Because the library is peaceful and receives plenty of natural light, many students choose it as a place to read or complete assignments."],
d2:["Lake Toba","Lake Toba is a vast volcanic lake in North Sumatra. From several viewpoints, visitors can see blue water surrounded by green hills and steep slopes. Samosir Island lies in the middle of the lake and is known for its Batak cultural heritage. Small villages, traditional houses, and farms appear around the landscape. In the morning, thin mist sometimes floats above the water, creating a calm atmosphere. The weather can be cool, especially in higher areas. Visitors often spend time enjoying the scenery, learning about local culture, and taking photographs. The combination of dramatic natural features and cultural traditions gives the area a distinctive character."],
d3:["A Vocational Workshop","The automotive workshop at Merdeka Vocational School is a busy but orderly place. It has several service bays, each marked with a number. Tool cabinets stand beside the workbenches, and every cabinet has labels for different equipment. At the back of the room, students can find a training engine mounted on a metal frame. Safety posters are placed near the entrance and above the main work area. The floor is made of textured material that helps reduce slipping. Bright overhead lamps make small engine components easier to inspect. Although the workshop is used for practical lessons, students are expected to return tools to their proper places after each activity."],
d4:["A Local Coffee Shop","Kopi Senja is a small coffee shop on a quiet street near the town park. Its front wall is made mostly of glass, so sunlight enters the room in the afternoon. Inside, wooden tables are arranged around several potted plants. A long shelf holds jars of coffee beans from different regions of Indonesia. The walls are decorated with simple photographs of farmers and coffee-growing landscapes. The shop plays soft instrumental music, and the aroma of freshly ground beans is noticeable as soon as a customer enters. A narrow outdoor terrace faces the park and has four small tables. The atmosphere is relaxed, making the shop popular with people who want to read, talk, or work on a laptop."],
d5:["The School Garden","The school garden occupies a rectangular area behind the classroom building. A narrow stone path divides the garden into four sections. The first section contains flowering plants in bright colors, while the second is used for vegetables such as tomatoes, spinach, and chilies. The third section has several young fruit trees, including guava and papaya. The fourth contains a small pond surrounded by ferns. Students from the environmental club water the plants every morning and record the growth of selected vegetables each week. A wooden sign at the entrance reminds visitors not to pick the plants without permission. The garden is both attractive and useful because it provides a quiet green space and supports practical environmental learning."],
r1:["My First School Exhibition","Last Friday, our class held a small exhibition of student projects. We arrived at school at seven in the morning to arrange posters, models, and demonstrations. My group was responsible for a simple water-filter model. At first, the filter leaked because one connection was loose. We checked the instructions again and tightened the connection. By nine o’clock, the model worked properly. During the exhibition, several visitors asked us how the filter removed dirt from water. I explained the process while my friends demonstrated each stage. At the end of the event, our teacher thanked everyone for working together. I felt relieved and proud because we had solved the problem before the visitors arrived."],
r2:["A Rainy Field Trip","Two weeks ago, my class visited a cultural museum in the city. The weather was sunny when we left school, but heavy rain began while our bus was on the way. Because the museum entrance was crowded, our teacher asked us to stay together and move carefully. We eventually entered the museum and visited an exhibition about traditional textiles. A guide explained the meanings of several patterns and showed us how some fabrics were made. After lunch, the rain became lighter, so we walked to a nearby heritage building. Before returning to school, we took a group photo under a covered walkway. Although the weather changed our schedule, I enjoyed the trip because I learned more about local culture."],
r3:["Joining a School Competition","Last month, I joined an English speech competition for the first time. For two weeks before the event, I practiced my speech every afternoon and asked my teacher to comment on my pronunciation. On competition day, I arrived early and watched several participants rehearse. When my turn came, I was nervous, but I remembered to breathe slowly and focus on the main ideas. I made one small pronunciation mistake in the middle of the speech, then continued without stopping. After the final participant finished, the judges announced the results. I did not receive the first prize, but I received a certificate for participation. More importantly, I learned that preparation helped me stay calm when something unexpected happened."],
r4:["Community Clean-Up Day","Last Sunday, residents in my neighborhood organized a clean-up day. We met at the community hall at eight o’clock and divided into small teams. My team cleaned the drainage area near the market, while other teams collected leaves and sorted recyclable materials. At first, the drainage area was difficult to clean because mud had accumulated after several rainy days. We worked carefully and finished the area before noon. Afterward, everyone returned to the hall, where volunteers separated plastic, paper, and metal for recycling. The neighborhood leader thanked the participants and suggested holding the activity once a month. I went home tired but satisfied because the streets looked cleaner and everyone had contributed."],
r5:["A School Technology Workshop","Yesterday, our class attended a workshop on creating simple websites. The instructor began by explaining how a webpage is structured. Then we practiced writing basic HTML in pairs. My partner and I created a page about our school library. Our first version looked too plain because we forgot to add headings and images. The instructor showed us how to improve the layout without changing the main information. We added a clear title, two headings, and two pictures. At the end of the session, each pair presented its page to the class. I was surprised that a few simple changes made our page easier to read. The workshop made me more interested in learning web design."]};

const L="ABCDE";let pk=0,Q,st;
const $=s=>document.getElementById(s),app=$("app");
function startMix(k){const seen={},all=[];PK.filter(p=>!p.mix).forEach(p=>p.q.forEach(x=>{const id=x[2]+x[3];if(!seen[id]){seen[id]=1;all.push(x)}}));for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}const ix=PK.findIndex(p=>p.mix);if(ix>=0)PK.splice(ix,1);PK.push({name:"Simulasi gabungan",mix:1,q:all.slice(0,k)});start(PK.length-1)}
function start(n){if(n!==undefined)pk=n;Q=PK[pk].q.map(x=>({p:x[0],m:x[1]=="M",c:x[1]=="C",cols:(x[6]||"").split("|"),q:x[2],o:x[3].split("|"),k:x[1]=="C"?[...x[4]].map(Number):[...x[4]].map(c=>L.indexOf(c)),e:x[5]}));st={i:0,a:Q.map(()=>[]),c:Q.map(()=>false),t:Date.now(),end:0,fin:false};clearInterval(st.iv);st.iv=setInterval(tick,1000);draw()}
function tick(){const e=$("tm");if(e&&!st.fin)e.textContent=fmt(Date.now()-st.t)}
function fmt(ms){const s=Math.floor(ms/1e3);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
const right=i=>{const a=st.a[i],k=Q[i].k;return Q[i].c?k.every((v,j)=>a[j]===v):a.length==k.length&&k.every(x=>a.includes(x))};
const done=i=>Q[i].c?Q[i].o.every((_,j)=>st.a[i][j]!==undefined):st.a[i].length>0;
function home(){clearInterval(st&&st.iv);app.innerHTML=`<h1>Simulasi TKA Bahasa Inggris SMK</h1><div class="card"><p>Latihan soal membaca untuk siswa SMK. Pilih jawaban, tekan <b>Periksa jawaban</b>, lalu baca penjelasan untuk opsi yang kamu pilih.</p><p>Soal pilihan ganda kompleks (pilih semua yang benar) bernilai 1 hanya jika semua pilihan tepat.</p><div class="row">${PK.filter(p=>!p.mix).map((p,n)=>`<button class="btn" onclick="start(${n})">Mulai ${p.name} (${p.q.length} soal)</button>`).join("")}</div><p style="margin-top:18px"><b>Simulasi gabungan</b>: soal diacak dari semua paket, tanpa soal ganda.</p><div class="row"><button class="btn ghost" onclick="startMix(25)">25 soal</button><button class="btn ghost" onclick="startMix(50)">50 soal</button><button class="btn ghost" onclick="startMix(999)">Semua soal</button></div></div>`}
function draw(){const i=st.i,q=Q[i],ch=st.c[i]||st.fin,a=st.a[i];
let h=`<div class="top"><span>Soal ${i+1} dari ${Q.length}</span><span id="tm">${fmt((st.fin?st.end:Date.now())-st.t)}</span></div><div class="card"><div class="grid">`+Q.map((_,j)=>`<button class="${j==i?"cur ":""}${st.c[j]||st.fin?(right(j)?"g-ok":"g-bad"):done(j)?"done":""}" onclick="go(${j})" aria-label="Soal ${j+1}">${j+1}</button>`).join("")+`</div></div>`;
if(q.p)for(const k of (P[q.p]?[q.p]:[...q.p])){const [t,b]=P[k];h+=`<div class="card pass"><h3>${t}</h3>${b.split("|").map(x=>`<p>${x}</p>`).join("")}</div>`}
h+=`<div class="card"><b>${q.q}</b>${q.m?`<div class="note">Pilih semua jawaban yang benar.</div>`:""}`;
if(q.c)q.o.forEach((o,j)=>{h+=`<div class="card" style="margin:8px 0;padding:10px"><div>${o}</div><div class="row" style="margin-top:6px">`+q.cols.map((cn,u)=>{const s=a[j]===u,k=q.k[j]===u;let c="opt";if(ch)c+=s&&k?" ok":s?" bad":k?" miss":"";else if(s)c+=" sel";return `<button class="${c}" style="width:auto;margin:0" ${ch?"disabled":""} onclick="pickC(${j},${u})">${cn}</button>`}).join("")+`</div>`+(ch?`<div class="note">${a[j]===q.k[j]?"✔ Pilihanmu tepat.":"✘ Seharusnya: "+q.cols[q.k[j]]+"."}</div>`:"")+`</div>`});else q.o.forEach((o,j)=>{const s=a.includes(j),k=q.k.includes(j);let c="opt";if(ch)c+=s&&k?" ok":s?" bad":k?" miss":"";else if(s)c+=" sel";
h+=`<button class="${c}" ${ch?"disabled":""} onclick="pick(${j})"><b>${L[j]}.</b> ${o}`+(ch&&(s||k)?`<div class="note">${s&&k?"✔ Pilihanmu tepat.":s?"✘ Pilihanmu kurang tepat; opsi ini tidak didukung teks.":"Ini juga jawaban benar yang belum kamu pilih."}</div>`:"")+`</button>`});
if(ch)h+=`<div class="exp"><b>${right(i)?"Benar.":"Jawaban benar: "+(q.c?q.o.map((o,j)=>o+" = "+q.cols[q.k[j]]).join("; "):q.k.map(x=>L[x]).join(", "))+"."}</b> ${q.e}</div>`;
h+=`<div class="row"><button class="btn ghost" onclick="go(${i-1})" ${i?"":"disabled"}>Sebelumnya</button>`+(ch?"":`<button class="btn" onclick="chk()" ${done(i)?"":"disabled"}>Periksa jawaban</button>`)+`<button class="btn ghost" onclick="go(${i+1})" ${i<Q.length-1?"":"disabled"}>Berikutnya</button>`+(st.fin?`<button class="btn" onclick="result()">Lihat skor</button>`:`<button class="btn" onclick="finish()">Selesai</button>`)+`</div></div>`;
app.innerHTML=h;scrollTo(0,0)}
function go(j){if(j>=0&&j<Q.length){st.i=j;draw()}}
function pick(j){const a=st.a[st.i];if(Q[st.i].m)a.includes(j)?a.splice(a.indexOf(j),1):a.push(j);else st.a[st.i]=[j];draw()}
function pickC(j,u){st.a[st.i][j]=u;draw()}
function chk(){st.c[st.i]=true;draw()}
function finish(){const n=Q.filter((_,i)=>!done(i)).length;if(n&&!confirm(n+" soal belum dijawab. Tetap selesai?"))return;st.fin=true;st.end=Date.now();clearInterval(st.iv);result()}
function result(){const s=Q.filter((_,i)=>right(i)).length,p=Math.round(s/Q.length*100);
const lv=p>=86?"Excellent / Highly Prepared":p>=71?"Good / Prepared":p>=56?"Developing / Needs Targeted Practice":p>=41?"Needs Improvement":"Needs Intensive Support";
app.innerHTML=`<h1>Hasil ${PK[pk].name}</h1><div class="card"><div class="score">${s}/${Q.length}</div><p>Nilai ${p} — ${lv}<br>Waktu: ${fmt(st.end-st.t)}</p><div class="row"><button class="btn" onclick="go(0)">Tinjau jawaban &amp; penjelasan</button><button class="btn ghost" onclick="start()">Ulangi</button><button class="btn ghost" onclick="home()">Beranda</button></div></div>`}
home();
</script></body></html>
